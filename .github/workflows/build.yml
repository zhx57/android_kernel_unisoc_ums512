name: Build ums512 kernel

on:
  workflow_dispatch:
  push:
    branches: [ "W20.13.3" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev rsync zip cpio python3 pkg-config libyaml-dev

      - name: Fetch prebuilt toolchain (AOSP GCC 4.9)
        run: |
          set -e
          git clone --depth=1 -b cm-14.0 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$HOME/tc-aarch64"
          git clone --depth=1 -b cm-14.0 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$HOME/tc-arm"
          echo "$HOME/tc-aarch64/bin" >> "$GITHUB_PATH"
          echo "$HOME/tc-arm/bin" >> "$GITHUB_PATH"
          "$HOME/tc-aarch64/bin/aarch64-linux-android-gcc" --version | head -n1
          "$HOME/tc-arm/bin/arm-linux-androideabi-gcc" --version | head -n1

      - name: Configure (defconfig, out-of-tree)
        run: |
          set -e
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          make O=out ARCH=arm64 sprd_sharkle_defconfig

      - name: Build kernel (out-of-tree)
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          HCF="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          echo "nproc=$(nproc)"
          make O=out ARCH=arm64 HOSTCFLAGS="$HCF" -j"$(nproc)" Image dtbs 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ums512
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/sprd/*.dtb
          if-no-files-found: warn
